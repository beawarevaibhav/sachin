<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: red;
            animation: myanime 2s cubic-bezier(1, 1.39, 0.21, 1.1) infinite;
        }

        .box2 {
            width: 200px;
            height: 200px;
            background-color: blue;
            animation: myanime 2s cubic-bezier(1, 1.39, 0.21, 1.1) infinite reverse;
            position: relative;
            bottom: 146px;
        }

        .box3 {
            width: 200px;
            height: 200px;
            background-color: green;
            animation: myanime 2s cubic-bezier(1, 1.39, 0.21, 1.1) infinite;
            position: relative;
            bottom: 292px;
        }
        .box4 {
            width: 200px;
            height: 200px;
            background-color: yellow;
            animation: myanime 2s cubic-bezier(1, 1.39, 0.21, 1.1) infinite reverse;
            position: relative;
            bottom: 438px;
            border-radius: 50%;
        }

        @keyframes myanime {
            to{
                transform: rotate(360deg);
            }
            from{
                transform: rotate(0deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="box">

    </div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
</body>
</html>
