<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cards {
            width: 200px;
            height: 200px;
            perspective: 1000px;
            background: #f4f4f4;
            position: relative;

        }
        .cardinner {
             width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-out;


        }

            .front, .back {
                width: 100%;
                height: 100%;
                position: absolute;
                backface-visibility: hidden;
                
                
            }

            .front {
                background: blue;
                color: white;
            }
            .back{
                background: red;
                transform: rotateY(180deg);
            }
            .cards:hover .cardinner {
                transform: rotateY(180deg);
            }


    </style>
</head>
<body>
    <div class="cards">

        <div class="cardinner">
        <div class="front">
        <p>hello my name is sachin</p>
        
        </div>

        <div class="back">

            <img height="100%" width="100%" src="WhatsApp Image 2026-08-10 at 10.16.07 PM.jpeg" alt="">
</div>
        </div>
    </div>
</body>
</html>
